<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIX — Моя музыка</title><link rel="stylesheet" href="styles.css?v=12"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"></head><body><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">V</span><span>VIX</span></a><div class="top-spacer"></div><a class="search-trigger" href="index.html">⌕ <span>Поиск</span></a></header><main class="page subpage"><section class="account-box"><div class="account-icon">♟</div><a class="login-btn" href="#">Войти</a><div class="uploaded-head"><div><p class="eyebrow">МОЯ МУЗЫКА</p><h2>Загруженные треки</h2></div><label class="add-btn" title="Добавить треки">+<input id="musicUpload" type="file" accept="audio/*" multiple hidden></label></div><div id="uploadedList" class="track-list"><div class="empty-upload">Здесь появятся песни, которые ты загрузишь со своего устройства.<br>Нажми <b>+</b>, чтобы добавить музыку.</div></div></section></main><nav class="bottom-nav"><a class="nav-item" href="index.html"><span>⌂</span><small>Главная</small></a><a class="nav-item" href="playlists.html"><span>▤</span><small>Плейлисты</small></a><a class="nav-item active" href="music.html"><span>♫</span><small>Моя музыка</small></a></nav><script src="nav.js?v=8"></script><script>const input=document.querySelector('#musicUpload'),list=document.querySelector('#uploadedList');input.addEventListener('change',()=>{const files=[...input.files].filter(f=>f.type.startsWith('audio/'));if(!files.length)return;list.innerHTML='';files.forEach(file=>{const url=URL.createObjectURL(file),row=document.createElement('div');row.className='track';row.innerHTML='<div class="track-cover playlist-art">♫</div><div class="track-info"><strong>'+file.name.replace(/\.[^/.]+$/,'')+'</strong><span>Загружено с устройства</span></div><button class="mini-play">▶</button>';row.querySelector('button').onclick=()=>new Audio(url).play();list.appendChild(row)})});</script></body></html>
